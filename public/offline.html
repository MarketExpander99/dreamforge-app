<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline - Skill Gain</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 400px;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.8;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .features {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
    }

    .features h3 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .features ul {
      list-style: none;
      text-align: left;
    }

    .features li {
      margin-bottom: 0.5rem;
      padding-left: 1.5rem;
      position: relative;
    }

    .features li:before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #4ade80;
      font-weight: bold;
    }

    .retry-btn {
      background: white;
      color: #667eea;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .retry-btn:hover {
      transform: translateY(-2px);
    }

    .status {
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📚</div>
    <h1>You're Offline</h1>
    <p>Your progress is saved and will sync when you're back online!</p>

    <div class="features">
      <h3>What you can still do:</h3>
      <ul>
        <li>Browse cached curriculum content</li>
        <li>Continue your current lessons</li>
        <li>View completed achievements</li>
        <li>Access your learning streak</li>
      </ul>
    </div>

    <button class="retry-btn" onclick="window.location.reload()">
      Try Again
    </button>

    <div class="status">
      <div id="network-status">Checking connection...</div>
    </div>
  </div>

  <script>
    // Check network status
    function updateNetworkStatus() {
      const status = document.getElementById('network-status');
      if (navigator.onLine) {
        status.textContent = 'Connection restored! Reloading...';
        setTimeout(() => window.location.reload(), 1000);
      } else {
        status.textContent = 'Still offline. Your data will sync automatically.';
      }
    }

    // Listen for network changes
    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);

    // Initial check
    updateNetworkStatus();
  </script>
</body>
</html>
